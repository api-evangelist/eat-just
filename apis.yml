aid: eat-just
name: Eat Just
description: 'Eat Just, Inc. is a food technology company founded in 2011 by Josh Tetrick
  and Josh Balk, headquartered in Alameda, California, that makes plant-based alternatives
  to animal products. Its flagship product is JUST Egg, a liquid and folded plant-based
  egg made from mung bean protein, alongside JUST Meat, JUST Protein and JUST condiments.
  Its GOOD Meat subsidiary produces cultivated chicken and in December 2020 became the
  first company in the world to receive regulatory approval to sell cultivated meat,
  in Singapore, followed by US FDA and USDA approval in June 2023. The company sells
  through retail, foodservice, restaurant and industrial channels in North America and
  Europe. Eat Just publishes no public developer portal, API documentation or machine-readable
  API contract; this profile records its public web and corporate surface only.'
